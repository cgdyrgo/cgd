<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CGD Portfolio</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      height: 100vh;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(6, 1fr);
      height: 100vh;
      width: 100vw;
    }

    .cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: 0.3s;
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    }

    .cell:hover .overlay {
      opacity: 1;
    }
  </style>
</head>

<body>

<main id="grid" class="grid-container"></main>

<script>
let students = [];

async function loadStudents() {
  const res = await fetch('./bilder/students.json');
  students = await res.json();
  buildGrid();
}

function buildGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  const last = students.at(-1);
  const rest = students.slice(0, -1);

  let i = 0;

  // ROWS 1-2 + 3 (utom special case)
  for (; i < rest.length; i++) {
    const s = rest[i];

    const cell = document.createElement("div");
    cell.className = "cell relative overflow-hidden";

    cell.innerHTML = `
      <img src="./bilder/${s.folder}/foto.jpg" />
      <div class="overlay"></div>
    `;

    grid.appendChild(cell);
  }

  // ROW 3 LEFT (last student)
  const lastCell = document.createElement("div");
  lastCell.className = "cell relative overflow-hidden col-span-2";

  lastCell.innerHTML = `
    <img src="./bilder/${last.folder}/foto.jpg" />
    <div class="overlay"></div>
  `;

  grid.appendChild(lastCell);

  // ROW 3 RIGHT (LOGO)
  const logo = document.createElement("div");
  logo.className = "relative overflow-hidden col-span-3";

  logo.innerHTML = `
    <img src="./logo.jpg" class="w-full h-full object-cover" />
  `;

  grid.appendChild(logo);
}

loadStudents();
</script>

</body>
</html>
