<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Obsidian Curator System</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;overflow:hidden}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(6,1fr);height:100vh;width:100vw}
.tile{position:relative;cursor:pointer;overflow:hidden}
.tile img:not(.logo){width:100%;height:100%;object-fit:cover;object-position:center;transform:scale(1.4);filter:grayscale(1);transition:.4s}
.tile:hover img{filter:grayscale(0);transform:scale(1.05)}
.tile span{position:absolute;bottom:8px;left:8px;font-size:10px;letter-spacing:.2em;color:#ff8c00;opacity:0;transition:.3s}
.tile img.logo{transform: none;object-fit: contain;}
.tile:hover span{opacity:1}

/* MODAL */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(25px)}
.modal{width:100vw;height:100vh;max-width:520px;aspect-ratio:2/3;background:#111;display:grid;grid-template-rows:30% 35% 35%;overflow:hidden}
.section{position:relative;overflow:hidden}
.section img,video{width:100%;height:100%;object-fit:cover}

/* middle */
.middle{
  display:grid;
  grid-template-columns:1fr 1fr;
  height:100%;
}

.middle > *{
  min-height:0;
}

.bio{
  padding:12px;
  color:#ddd;
  display:flex;
  flex-direction:column;
  height:100%;
  box-sizing:border-box;
  overflow:hidden;
}

/* text tar all fri yta och klipper vid overflow */
#bioText{
  font-size:clamp(13px, 1.9vw, 18px);
  line-height:1.3;
  overflow:hidden;
  flex:1;
  min-height:0;
}

/* knappen låses i botten */
.bio button{
  margin-top:auto;
  padding:8px;
  border:0;
  border-radius:999px;
  background:#ff8c00;
  color:#000;
  font-weight:700;
  cursor:pointer;
  font-size:clamp(10px, 1vw, 13px);
}



.portrait{
  position:relative;
}

.portrait h1{
  position:absolute;
  bottom:10px;
  left:10px;
  font-size:14px;
  margin:0;
}

.bottom{display:grid;grid-template-columns:1fr 1fr}

/* ROW 3 LOGO ONLY (safe override) */
#logoTile img{
  transform:none;
  width: 100%;
  height: 100%;
  object-fit:contain;
  object-position: center;
  background:#000;
  padding:0px;
  display:block;
}

@media (max-aspect-ratio: 9/10) {
  .grid {
    grid-template-rows: repeat(6, minmax(0, 1fr));
  }

  .tile img {
    object-position: center;
  }
}

@media (min-aspect-ratio: 7/10) {

  body {
    display: flex;
    flex-direction: row-reverse;
  }

  .grid {
    width: 53vw;
    height: 100vh;
  }

  .overlay {
    position: absolute;
    left: 0;
    top: 0;
    width: 47vw;
    height: 100vh;
  }

  .modal {
    width: 100%;
    height: 100%;
    max-width: none;
  }
}

</style>
</head>
<body>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">

    <div class="section">
      <video id="showreel" autoplay muted loop playsinline webkit-playsinline></video>
    </div>

    <div class="section middle">
      <div class="bio">
        <p id="bioText"></p>
        <button id="portfolioBtn">Portfolio</button>
      </div>
      <div class="portrait">
        <img id="foto" />
        <h1 id="name"></h1>
      </div>
    </div>

    <div class="section bottom">
      <img id="img1" />
      <img id="img2" />
    </div>

  </div>
</div>

<script>

/* =========================
   DATA LOADER (SYSTEM CORE)
========================= */

async function loadStudents() {
  const res = await fetch('./bilder/students.json');
  return await res.json();
}

async function loadText(path) {
  const res = await fetch(path);
  return await res.text();
}

function asset(folder, file) {
  return `./bilder/${folder}/${file}`;
}

/* =========================
   GRID COMPONENT
========================= */

function createGrid(students) {
  const grid = document.getElementById('grid');

  students.forEach((s, i) => {

    //  När vi når början av rad 3
    if (i === 10) {

      //  Student (vänster)
      const tile = document.createElement('div');
      tile.className = 'tile';

      tile.innerHTML = `
        <img src="${asset(s.folder,'foto.jpg')}" />
        <span>${s.name.toUpperCase()}</span>
      `;

      tile.onclick = () => openStudent(s);
      grid.appendChild(tile);

      //  Logga (höger, 4 kolumner)
      const logoTile = document.createElement('div');
      logoTile.className = 'tile';
      logoTile.id = 'logoTile';
      logoTile.style.gridColumn = "span 4";

      logoTile.innerHTML = `
        <img class="logo" src="./logo.jpg" />
      `;

      grid.appendChild(logoTile);

      return;
    }

    //  Alla andra studenter fortsätter som vanligt (INGEN skip)
    const tile = document.createElement('div');
    tile.className = 'tile';

    tile.innerHTML = `
      <img src="${asset(s.folder,'foto.jpg')}" />
      <span>${s.name.toUpperCase()}</span>
    `;

    tile.onclick = () => openStudent(s);
    grid.appendChild(tile);
  });
}

/* =========================
   MODAL COMPONENT
========================= */

async function openStudent(student) {

  const bio = await loadText(asset(student.folder,'bio.txt'));
  const portfolio = await loadText(asset(student.folder,'portfoliolink.txt'));

  document.getElementById('bioText').textContent = bio;
  document.getElementById('name').textContent = student.name;

  document.getElementById('foto').src = asset(student.folder,'foto.jpg');
  document.getElementById('img1').src = asset(student.folder,'bild1.jpg');
  document.getElementById('img2').src = asset(student.folder,'bild2.jpg');
  document.getElementById('showreel').src = asset(student.folder,'showreel.webm');

  const btn = document.getElementById('portfolioBtn');
  btn.onclick = (e) => {
     e.stopPropagation();
     window.open(portfolio, '_blank');
  };

  document.getElementById('overlay').style.display = 'flex';
}

function handleOverlayClick(e) {
  closeModal();
}

function closeModal() {
  document.getElementById('overlay').style.display = 'none';
}

/* =========================
   INIT
========================= */

(async function init(){
  const students = await loadStudents();
  createGrid(students);
})();

</script>

</body>
</html>
