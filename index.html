<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CG25 Portfolios</title>

<style>

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:system-ui;
  overflow:hidden;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(5,1fr);
  height:100vh;
  height:100dvh;
  width:100vw;
}

.tile{
  position:relative;
  cursor:pointer;
  overflow:hidden;
}

/* båda bilderna staplas */

.tile img:not(.logo){
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;

  transform-origin:50% 40%;
  transform:scale(1.0);

  transition:
    opacity .4s,
    transform .4s,
    filter .4s;
}

/* default bild */

.img-default{
  opacity:1;
}

/* hover/selected bild */

.img-hover{
  opacity:0;
}

/* hover */

.tile:hover .img-default{
  opacity:0;
  transform:scale(1.3);
}

.tile:hover .img-hover{
  opacity:1;
  transform:scale(1.3);
}

/* text */

.tile span{
  position:absolute;
  bottom:8px;
  left:8px;
  font-size:9px;
  letter-spacing:.2em;
  color:#fff;
  opacity:0;
  transition:.3s;
}

.tile:hover span{
  opacity:1;
}

/* logo */

.tile img.logo{
  transform:none;
  object-fit:contain;
}

/* selected */

.tile.selected .img-default{
  opacity:0;
}

.tile.selected .img-hover{
  opacity:1;
}

.tile.selected span{
  opacity:.8;
  color:#fff;
}

/* MODAL */

.overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.6);
  backdrop-filter:blur(10px);

  z-index:10;
}

.modal{
  width:100vw;
  height:100vh;
  height:100dvh;

  max-width:520px;
  aspect-ratio:2/3;

  background:#000;

  display:grid;
  grid-template-rows:30% 35% 35%;

  overflow:hidden;
}

.section{
  position:relative;
  overflow:hidden;
}

.section img,
.section video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* middle */

.middle{
  display:grid;
  grid-template-columns:1fr 1fr;
  height:100%;
}

.middle > *{
  min-height:0;
}

.bio{
  container-type:size;

  padding:10px;

  color:#fff;

  display:flex;
  flex-direction:column;

  height:100%;

  box-sizing:border-box;
  overflow:hidden;
}

#bioText{
  font-size:clamp(13px, 1.9vw, 18px);
  font-size:clamp(6px, 4cqw + 4cqh, 40px);

  line-height:1.3;

  overflow:hidden;

  flex:1;
  min-height:0;
}

/* button */

.bio button{
  margin-top:auto;

  padding:8px;

  border:1px solid rgba(255,255,255,0.4);
  border-radius:999px;

  background:transparent;

  color:#fff;

  font-weight:700;

  cursor:pointer;

  font-size:clamp(12px, 1vw + 1vh, 18px);
}

/* portrait */

.portrait{
  position:relative;
}

.portrait h1{
  position:absolute;

  bottom:10px;
  left:50%;

  transform:translateX(-50%);

  font-size:clamp(10px, 0.8vw + 0.8vh, 16px);

  letter-spacing:.2em;

  color:#fff;

  text-transform:uppercase;

  margin:0;

  font-family:system-ui;

  text-align:center;
}

/* close hint */

.closeHint{
  position:absolute;

  top:10px;
  right:10px;

  width:28px;
  height:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:18px;

  color:rgba(255,255,255,0.8);

  border:1px solid rgba(255,255,255,0.25);
  border-radius:999px;

  background:rgba(0,0,0,0.25);

  backdrop-filter:blur(4px);

  pointer-events:none;
  user-select:none;
}

.bottom{
  display:grid;
  grid-template-columns:1fr 1fr;
}

/* logo tile */

#logoTile img{
  transform:none;

  width:100%;
  height:100%;

  object-fit:contain;
  object-position:center;

  background:#000;

  padding:0px;

  display:block;
}

/* =========================
   IDLE MODAL
========================= */

.idleModal{
  display:none;

  position:absolute;

  left:0;
  top:0;

  width:40vw;
  height:100vh;
  height:100dvh;

  background:#000;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  z-index:1;

  cursor:pointer;
}

.idleModal img{
  width:100%;
  height:auto;
  max-width:100%;
  object-fit:initial;
  display:block;
}
.idleModal video{
  width:100%;
  height:100%;

  object-fit:cover;
}

#idleVideo{
  opacity:1;
  transition:opacity .7s;
}

/* portrait */

@media (max-aspect-ratio: 7/10){

  .grid{
    grid-template-rows:repeat(5, minmax(0,1fr));
  }

  .tile img{
    object-position:center;
  }
}

/* landscape desktop/tablet */

@media (min-aspect-ratio: 7/10){

  body{
    display:flex;
    flex-direction:row-reverse;
  }

  .grid{
    width:60vw;
    height:100vh;
    height:100dvh;
  }

  .overlay{
    position:absolute;

    left:0;
    top:0;

    width:40vw;
    height:100vh;
    height:100dvh;
  }

  .idleModal{
    display:flex;
  }

  .modal{
    width:100%;
    height:100%;

    max-width:none;

    grid-template-rows:31% 36% 33%;
  }

  #bioText{
    font-size:clamp(13px, 1.9vw, 18px);
    font-size:clamp(6px, 3.6cqw + 3.6cqh, 40px);
  }
}

/* mobile landscape */

@media (min-aspect-ratio: 10/6) and (hover:none){

  .grid{
    width:53vw;
  }

  .overlay{
    width:47vw;
  }

  .idleModal{
    width:47vw;
  }

  .modal{
    grid-template-rows:50% 50% 0%;
  }
}

</style>
</head>

<body>

<div class="grid" id="grid"></div>

<div class="idleModal" id="idleModal">

  <img id="idleImage" src="./qr.jpg" />
  <video id="idleVideo" muted playsinline webkit-playsinline style="display:none"></video>

</div>

<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">

  <div class="modal" id="modal">

    <div class="section">
      <video id="showreel" autoplay muted loop playsinline webkit-playsinline></video>
    </div>

    <div class="section middle">

      <div class="bio">
        <p id="bioText"></p>
        <button id="portfolioBtn">Portfolio</button>
      </div>

      <div class="portrait">
        <img id="foto" />
        <h1 id="name"></h1>
        <div class="closeHint">×</div>
      </div>

    </div>

    <div class="section bottom">
      <img id="img1" />
      <img id="img2" />
    </div>

  </div>

</div>

<script>

/* =========================
   STATE
========================= */

const selectedStudents = new Set();
let allStudents = [];

let idleMode = 0;
let reelIndex = 0;

// Autoplay state
let autoplayInterval = null;
let isAutoplayActive = false;
let logoClickCount = 0;
let lastLogoClickTime = 0;

/* =========================
   DATA
========================= */

async function loadStudents(){
  const res = await fetch('./bilder/students.json');
  return await res.json();
}

async function loadText(path){
  const res = await fetch(path);
  return await res.text();
}

function asset(folder,file){
  return `./bilder/${folder}/${file}`;
}

/* =========================
   AUTOPLAY LOGIC
========================= */

function toggleAutoplay(forceOff = false) {
  const gridTiles = document.querySelectorAll('.tile');
  
  if (isAutoplayActive || forceOff) {
    // STOPPA
    clearInterval(autoplayInterval);
    isAutoplayActive = false;
    autoplayInterval = null;
    
    // Rensa .selected från alla i grid
    gridTiles.forEach(t => t.classList.remove('selected'));
    // Vi rensar även setet så de inte hänger kvar visuellt efter slideshow
    selectedStudents.clear();
    
    closeModal();
    return;
  }

  // STARTA
  isAutoplayActive = true;
  let currentIndex = 0;

  // Markera hela gridden
  gridTiles.forEach(t => t.classList.add('selected'));

  const runCycle = () => {
    if (!isAutoplayActive) return;
    openStudent(allStudents[currentIndex]);
    currentIndex = (currentIndex + 1) % allStudents.length;
  };

  runCycle(); // Kör första direkt
  autoplayInterval = setInterval(runCycle, 10000); // 10 sekunder
}

/* =========================
   GRID TILE
========================= */

function createTile(s){

  const tile = document.createElement('div');
  tile.className = 'tile';

  if(selectedStudents.has(s.folder)){
    tile.classList.add('selected');
  }

  tile.innerHTML = `
    <img class="img-default" src="${asset(s.folder,'foto.jpg')}" />
    <img class="img-hover" src="${asset(s.folder,'foto_select.jpg')}" />
    <span>${s.name.toUpperCase()}</span>
  `;

  tile.onclick = (e) => {
    // Om autoplay är aktivt, låt det globala klicket stänga av allt istället
    if (isAutoplayActive) return;

    selectedStudents.add(s.folder);
    tile.classList.add('selected');
    openStudent(s);
  };

  return tile;
}

/* =========================
   GRID
========================= */

function createGrid(students){

  const grid = document.getElementById('grid');

  students.forEach((s,i)=>{

    if(i === 10){

      grid.appendChild(createTile(s));

      const logoTile = document.createElement('div');

      logoTile.className = 'tile';
      logoTile.id = 'logoTile';

      logoTile.style.gridColumn = "span 4";

      logoTile.innerHTML = `
        <img class="logo" src="./logo.jpg" />
      `;

      // Trigger för Autoplay (3 klick)
      logoTile.onclick = (e) => {
        if (isAutoplayActive) return; // Låt globala lyssnaren sköta stoppet

        e.stopPropagation();
        const now = Date.now();
        if (now - lastLogoClickTime > 500) logoClickCount = 0;
        
        logoClickCount++;
        lastLogoClickTime = now;

        if (logoClickCount === 3) {
          toggleAutoplay();
          logoClickCount = 0;
        }
      };

      grid.appendChild(logoTile);

      return;
    }

    grid.appendChild(createTile(s));
  });
}

/* =========================
   MODAL
========================= */

async function openStudent(student){

  const bio = await loadText(asset(student.folder,'bio.txt'));
  const portfolio = await loadText(asset(student.folder,'portfoliolink.txt'));

  document.getElementById('bioText').textContent = bio;

  document.getElementById('name').textContent = student.name;

  document.getElementById('foto').src =
    asset(student.folder,'foto_select.jpg');

  document.getElementById('img1').src =
    asset(student.folder,'bild1.jpg');

  document.getElementById('img2').src =
    asset(student.folder,'bild2.jpg');

  document.getElementById('showreel').src =
    asset(student.folder,'showreel.webm');

  const btn = document.getElementById('portfolioBtn');

  btn.onclick = (e)=>{
    e.stopPropagation();
    window.open(portfolio,'_blank');
  };

  document.getElementById('overlay').style.display = 'flex';
  document.getElementById('idleModal').style.display = 'none';
}

/* =========================
   CLOSE / GLOBAL STOP
========================= */

function handleOverlayClick(e){
  // Om vi inte är i autoplay, stäng som vanligt
  if (!isAutoplayActive) {
    closeModal();
  }
}

function closeModal(){
  document.getElementById('overlay').style.display = 'none';

  if(window.matchMedia("(min-aspect-ratio: 7/10)").matches){
    document.getElementById('idleModal').style.display = 'flex';
  }
}

// Global lyssnare för att avbryta autoplay
window.addEventListener('click', (e) => {
  if (isAutoplayActive) {
    // Stoppa autoplay oavsett var man klickar
    toggleAutoplay(true);
  }
}, true); // Använder capturing för att garantera att vi fångar klicket

/* =========================
   IDLE MODAL
========================= */

function updateIdleMode(){

  const idleImage = document.getElementById('idleImage');
  const idleVideo = document.getElementById('idleVideo');

  idleImage.style.display = 'none';
  idleVideo.style.display = 'none';

  if(idleMode === 0){
    idleImage.src = './co_b.jpg';
    idleImage.style.display = 'block';
  }

  if(idleMode === 1){
    idleImage.src = './qr.jpg';
    idleImage.style.display = 'block';
  }

  if(idleMode === 2){
    playIdleReels();
  }
}

function playIdleReels(){

  const idleVideo = document.getElementById('idleVideo');
  idleVideo.style.display = 'block';

  const reels = allStudents.map(s =>
    asset(s.folder,'showreel.webm')
  );

  function playNext(){
    idleVideo.style.opacity = 0;
    setTimeout(()=>{
      idleVideo.src = reels[reelIndex];
      idleVideo.play();
      idleVideo.style.opacity = 1;
      reelIndex = (reelIndex + 1) % reels.length;
    },700);
  }

  playNext();
  idleVideo.onended = playNext;
}

document.getElementById('idleModal').onclick = (e)=>{
  e.stopPropagation();
  idleMode = (idleMode + 1) % 3;
  updateIdleMode();
};

/* =========================
   INIT
========================= */

(async function init(){
  const students = await loadStudents();
  allStudents = students;
  createGrid(students);
  updateIdleMode();
})();

</script>

</body>
</html>
