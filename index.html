<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CG25 Portfolios</title>

<style>

/* =========================
   BASE
========================= */

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:system-ui;
  overflow:hidden;
}

/* =========================
   GRID
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(5,1fr);
  height:100vh;
  height:100dvh;
  width:100vw;
}

.tile{
  position:relative;
  cursor:pointer;
  overflow:hidden;
}

/* images */

.tile img:not(.logo){
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  transform-origin:50% 40%;
  transition:opacity .4s, transform .4s;
}

.img-default{opacity:1;}
.img-hover{opacity:0;}

.tile:hover .img-default{
  opacity:0;
  transform:scale(1.3);
}

.tile:hover .img-hover{
  opacity:1;
  transform:scale(1.3);
}

/* text */

.tile span{
  position:absolute;
  bottom:8px;
  left:8px;
  font-size:9px;
  letter-spacing:.2em;
  color:#fff;
  opacity:0;
  transition:.3s;
}

.tile:hover span{opacity:1}

/* logo */

.tile img.logo{
  transform:none;
  object-fit:contain;
}

/* selected */

.tile.selected .img-default{opacity:0;}
.tile.selected .img-hover{opacity:1;}
.tile.selected span{opacity:.8;}

/* =========================
   MODAL
========================= */

.overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(10px);
  z-index:10;
}

.modal{
  width:100vw;
  height:100vh;
  height:100dvh;
  max-width:520px;
  aspect-ratio:2/3;
  background:#000;
  display:grid;
  grid-template-rows:30% 30% 40%;
  overflow:hidden;
}

.section{
  position:relative;
  overflow:hidden;
}

.section img,
.section video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* middle */

.middle{
  display:grid;
  grid-template-columns:1fr 1fr;
  height:100%;
}

.bio{
  container-type:size;
  padding:10px;
  display:flex;
  flex-direction:column;
  height:100%;
  overflow:hidden;
}

#bioText{
  font-size:clamp(6px, 4.2cqw + 4.2cqh, 40px);
  line-height:1.3;
  flex:1;
  overflow:hidden;
}

/* button */

.bio button{
  margin-top:auto;
  padding:8px;
  border:1px solid rgba(255,255,255,.4);
  border-radius:999px;
  background:transparent;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

/* portrait */

.portrait{
  position:relative;
}

.portrait h1{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  font-size:clamp(10px,.8vw + .8vh,16px);
  letter-spacing:.2em;
  text-transform:uppercase;
}

/* logo tile */

#logoTile img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* =========================
   IDLE MODAL
========================= */

.idleModal{
  display:none;
  position:absolute;
  left:0;
  top:0;
  width:40vw;
  height:100vh;
  height:100dvh;
  background:#000;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  cursor:pointer;
}

.idleModal img{
  width:100%;
  height:auto;
  display:block;
}

.idleModal video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* =========================
   AUTOPLAY MODE
========================= */

body.autoplay .tile{
  pointer-events:none;
}

/* =========================
   MEDIA
========================= */

@media (min-aspect-ratio:7/10){

  body{
    display:flex;
    flex-direction:row-reverse;
  }

  .grid{
    width:60vw;
  }

  .overlay{
    position:absolute;
    left:0;
    top:0;
    width:40vw;
  }

  .idleModal{
    display:flex;
  }
}

</style>
</head>

<body>

<div class="grid" id="grid"></div>

<div class="idleModal" id="idleModal">
  <img id="idleImage" src="./qr.jpg" />
  <video id="idleVideo" muted playsinline style="display:none"></video>
</div>

<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal">

    <div class="section">
      <video id="showreel" autoplay muted loop playsinline></video>
    </div>

    <div class="section middle">
      <div class="bio">
        <p id="bioText"></p>
        <button id="portfolioBtn">Portfolio</button>
      </div>
      <div class="portrait">
        <img id="foto" />
        <h1 id="name"></h1>
      </div>
    </div>

    <div class="section">
      <img id="img1" />
      <img id="img2" />
    </div>

  </div>
</div>

<script>

/* =========================
   STATE
========================= */

let students = [];
let selectedStudents = new Set();

let autoplay = false;
let autoplayIndex = 0;
let autoplayTimer = null;

/* =========================
   LOAD
========================= */

async function loadStudents(){
  const res = await fetch('./bilder/students.json');
  return await res.json();
}

function asset(f, file){
  return `./bilder/${f}/${file}`;
}

/* =========================
   GRID
========================= */

function createTile(s){

  const tile = document.createElement('div');
  tile.className = 'tile';

  tile.innerHTML = `
    <img class="img-default" src="${asset(s.folder,'foto.jpg')}" />
    <img class="img-hover" src="${asset(s.folder,'foto_select.jpg')}" />
    <span>${s.name.toUpperCase()}</span>
  `;

  tile.onclick = () => {

    if(!autoplay){
      selectedStudents.add(s.folder);
      tile.classList.add('selected');
    }

    openStudent(s);
  };

  return tile;
}

function renderGrid(){

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  students.forEach((s,i)=>{

    if(i === 10){

      grid.appendChild(createTile(s));

      const logoTile = document.createElement('div');
      logoTile.className = 'tile';
      logoTile.style.gridColumn = "span 4";

      logoTile.innerHTML = `<img class="logo" src="./logo.jpg" />`;

      logoTile.onclick = handleLogoClick;

      grid.appendChild(logoTile);

      return;
    }

    grid.appendChild(createTile(s));
  });
}

/* =========================
   MODAL
========================= */

async function openStudent(s){

  const bio = await fetch(asset(s.folder,'bio.txt')).then(r=>r.text());
  const portfolio = await fetch(asset(s.folder,'portfoliolink.txt')).then(r=>r.text());

  document.getElementById('bioText').textContent = bio;
  document.getElementById('name').textContent = s.name;

  document.getElementById('foto').src = asset(s.folder,'foto_select.jpg');
  document.getElementById('img1').src = asset(s.folder,'bild1.jpg');
  document.getElementById('img2').src = asset(s.folder,'bild2.jpg');
  document.getElementById('showreel').src = asset(s.folder,'showreel.webm');

  document.getElementById('portfolioBtn').onclick = (e)=>{
    e.stopPropagation();
    window.open(portfolio,'_blank');
  };

  document.getElementById('overlay').style.display = 'flex';
  document.getElementById('idleModal').style.display = 'none';
}

/* =========================
   CLOSE
========================= */

function closeModal(){
  document.getElementById('overlay').style.display = 'none';

  if(window.matchMedia("(min-aspect-ratio:7/10)").matches){
    document.getElementById('idleModal').style.display = 'flex';
  }
}

function handleOverlayClick(){
  if(autoplay) stopAutoplay();
  else closeModal();
}

/* =========================
   AUTOPLAY
========================= */

let logoClicks = 0;
let logoTimer;

function handleLogoClick(){

  logoClicks++;

  clearTimeout(logoTimer);

  logoTimer = setTimeout(()=>logoClicks=0,500);

  if(logoClicks >= 3){

    logoClicks = 0;

    autoplay ? stopAutoplay() : startAutoplay();
  }
}

function startAutoplay(){

  autoplay = true;
  autoplayIndex = 0;

  document.body.classList.add('autoplay');

  run();
}

function run(){

  if(!autoplay) return;

  const s = students[autoplayIndex];

  /* 🔥 MARK ALL STUDENTS TEMPORARILY */
  document.querySelectorAll('.tile').forEach(t=>{
    t.classList.add('selected');
  });

  openStudent(s);

  autoplayIndex = (autoplayIndex + 1) % students.length;

  autoplayTimer = setTimeout(run,10000);
}

function stopAutoplay(){

  autoplay = false;

  clearTimeout(autoplayTimer);

  document.body.classList.remove('autoplay');

  selectedStudents.clear();

  document.querySelectorAll('.tile').forEach(t=>{
    t.classList.remove('selected');
  });

  closeModal();
}

/* =========================
   INIT
========================= */

(async function(){

  students = await loadStudents();

  renderGrid();

})();

</script>

</body>
</html>
