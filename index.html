<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>w1p p0rtf0l10w0rk cg25</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;overflow:hidden}

/* GRID                                                         change rows here v      */
.grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);height:100vh;height:100dvh;width:100vw}
.tile{position:relative;cursor:pointer;overflow:hidden}
/* båda bilderna staplas */
.tile img:not(.logo){position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;
  transform-origin: 50% 40%; /* zoomcenter lite ovanför center */
  transform:scale(1.0);
  /*filter:grayscale(1);*/
  transition:opacity .4s, transform .4s, filter .4s;
}

/* default bild */
.img-default{
  opacity:1;
}

/* hover/selected bild */
.img-hover{
  opacity:0;
}

/* HOVER effekt */
.tile:hover .img-default{
  opacity:0;
  /*filter:grayscale(0);*/
  transform:scale(1.3);
}

.tile:hover .img-hover{
  opacity:1;
  transform:scale(1.3);
}

/* text */
.tile span{
  position:absolute;
  bottom:8px;
  left:8px;
  font-size:9px;
  letter-spacing:.2em;
  color:#fff;
  opacity:0;
  transition:.3s;
}

.tile:hover span{opacity:1}

/* logo untouched */
.tile img.logo{
  transform:none;
  object-fit:contain;
}

.tile.selected .img-default{/* Förändring vid markerad*/
  opacity:0;
}

.tile.selected .img-hover{/* Förändring vid markerad*/
  opacity:1;
}

.tile.selected span{/* Förändring vid markerad*/
  opacity:0.8;
  color:#fff;
}


  
/* MODAL */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(10px)}
.modal{width:100vw;height:100vh;height:100dvh;max-width:520px;aspect-ratio:2/3;background:#000;display:grid;grid-template-rows:30% 30% 40%;overflow:hidden}
.section{position:relative;overflow:hidden}
.section img,video{width:100%;height:100%;object-fit:cover}

/* middle */
.middle{
  display:grid;
  grid-template-columns:1fr 1fr;
  height:100%;
}

.middle > *{
  min-height:0;
}

.bio{
  container-type: size;
  padding:10px;
  color:#fff;
  display:flex;
  flex-direction:column;
  height:100%;
  box-sizing:border-box;
  overflow:hidden;
}

/* text tar all fri yta och klipper vid overflow */
#bioText{
  font-size:clamp(13px, 1.9vw, 18px);/*fallback*/
  font-size: clamp(6px, 4.2cqw + 4.2cqh, 40px);
  line-height:1.3;
  overflow:hidden;
  flex:1;
  min-height:0;
}

/* knappen låses i botten */
.bio button{
  margin-top:auto;
  padding:8px;
  border: 1px solid rgba(255,255,255,0.4);
  border-radius:999px;
  background: transparent;
  color: #fff;
  font-weight:700;
  cursor:pointer;
  font-size: clamp(12px, 1vw + 1vh, 18px);
}



.portrait{
  position:relative;
}

.portrait h1{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  font-size: clamp(10px, 0.8vw + 0.8vh, 16px);
  letter-spacing:.2em;
  color:#fff;
  text-transform:uppercase;
  margin:0;
  font-family:system-ui;
  text-align:center;
}

.closeHint{
  position:absolute;
  top:10px;
  right:10px;

  width:28px;
  height:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:18px;
  color:rgba(255,255,255,0.8);

  border:1px solid rgba(255,255,255,0.25);
  border-radius:999px;

  background:rgba(0,0,0,0.25);
  backdrop-filter:blur(4px);

  pointer-events:none;
  user-select:none;
}

.bottom{display:grid;grid-template-columns:1fr 1fr}

/* ROW 3 LOGO ONLY (safe override) */
#logoTile img{
  transform:none;
  width: 100%;
  height: 100%;
  object-fit:contain;
  object-position: center;
  background:#000;
  padding:0px;
  display:block;
}

@media (max-aspect-ratio: 7/10) {
  .grid {/* media query rows!  v */
    grid-template-rows: repeat(5, minmax(0, 1fr));
  }

  .tile img {
    object-position: center;
  }
}

@media (min-aspect-ratio: 7/10) {/* if wide but not mobile landscape */

  body {
    display: flex;
    flex-direction: row-reverse;
  }

  .grid {
    width: 50vw;
    height: 100vh; /*lder models fallback*/
    height: 100dvh;
  }

  .overlay {
    position: absolute;
    left: 0;
    top: 0;
    width: 50vw;
    height: 100vh;  /*lder models fallback*/
    height: 100dvh;
  }

  .modal {
    width: 100%;
    height: 100%;
    max-width: none;
    grid-template-rows:30% 30% 40%; /* test*/
  }
  
  #bioText{
    font-size:clamp(13px, 1.9vw, 18px);/*fallback*/
    font-size: clamp(6px, 3.8cqw + 3.8cqh, 40px);
}

  
}

@media (min-aspect-ratio: 10/6) and (hover:none) {/* if mobile landscape aspect */

  body {
    display: flex;
    flex-direction: row-reverse;
  }

  .grid {
    width: 53vw;
    height: 100vh; /*lder models fallback*/
    height: 100dvh;
  }

  .overlay {
    position: absolute;
    left: 0;
    top: 0;
    width: 47vw;
    height: 100vh;  /*lder models fallback*/
    height: 100dvh;
  }

  .modal {
    width: 100%;
    height: 100%;
    max-width: none;
    grid-template-rows:50% 50% 0%; /* test*/
  }
}


</style>
</head>
<body>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">

    <div class="section">
      <video id="showreel" autoplay muted loop playsinline webkit-playsinline></video>
    </div>

    <div class="section middle">
      <div class="bio">
        <p id="bioText"></p>
        <button id="portfolioBtn">Portfolio</button>
      </div>
      <div class="portrait">
        <img id="foto" />
        <h1 id="name"></h1>
        <div class="closeHint">×</div> 
      </div>
    </div>

    <div class="section bottom">
      <img id="img1" />
      <img id="img2" />
    </div>

  </div>
</div>

<script>

/* =========================
   STATE (markerade studenter)
========================= */

const selectedStudents = new Set();

/* =========================
   DATA LOADER
========================= */

async function loadStudents() {
  const res = await fetch('./bilder/students.json');
  return await res.json();
}

async function loadText(path) {
  const res = await fetch(path);
  return await res.text();
}

function asset(folder, file) {
  return `./bilder/${folder}/${file}`;
}

/* =========================
   GRID
========================= */

function createTile(s) {
  const tile = document.createElement('div');
  tile.className = 'tile';

  // restore selection state
  if (selectedStudents.has(s.folder)) {
    tile.classList.add('selected');
  }

  tile.innerHTML = `
    <img class="img-default" src="${asset(s.folder,'foto.jpg')}" />
    <img class="img-hover" src="${asset(s.folder,'foto_select.jpg')}" />
    <span>${s.name.toUpperCase()}</span>
  `;

  tile.onclick = () => {
    selectedStudents.add(s.folder);
    tile.classList.add('selected');
    openStudent(s);
  };

  return tile;
}

/* =========================
   GRID BUILDER
========================= */

function createGrid(students) {
  const grid = document.getElementById('grid');

  students.forEach((s, i) => {

    // special row (logo break)
    if (i === 10) {

      grid.appendChild(createTile(s));

      const logoTile = document.createElement('div');
      logoTile.className = 'tile';
      logoTile.id = 'logoTile';
      logoTile.style.gridColumn = "span 4";

      logoTile.innerHTML = `
        <img class="logo" src="./logo.jpg" />
      `;

      grid.appendChild(logoTile);

      return;
    }

    grid.appendChild(createTile(s));
  });
}

/* =========================
   MODAL
========================= */

async function openStudent(student) {

  const bio = await loadText(asset(student.folder,'bio.txt'));
  const portfolio = await loadText(asset(student.folder,'portfoliolink.txt'));

  document.getElementById('bioText').textContent = bio;
  document.getElementById('name').textContent = student.name;

  document.getElementById('foto').src = asset(student.folder,'foto_select.jpg');
  document.getElementById('img1').src = asset(student.folder,'bild1.jpg');
  document.getElementById('img2').src = asset(student.folder,'bild2.jpg');
  document.getElementById('showreel').src = asset(student.folder,'showreel.webm');

  const btn = document.getElementById('portfolioBtn');
  btn.onclick = (e) => {
    e.stopPropagation();
    window.open(portfolio, '_blank');
  };

  document.getElementById('overlay').style.display = 'flex';
}

/* =========================
   CLOSE MODAL
========================= */

function handleOverlayClick(e) {
  closeModal();
}

function closeModal() {
  document.getElementById('overlay').style.display = 'none';
}

/* =========================
   INIT
========================= */

(async function init(){
  const students = await loadStudents();
  createGrid(students);
})();

</script>
  
</body>
</html>
